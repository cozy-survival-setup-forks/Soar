name: Soar
version: '${version}'
main: dev.soar.SoarPlugin
api-version: '1.21'
authors: [Groovyy Roy]
description: Flight that is paid for in time, made to share flight with Origins-Reborn
softdepend:
  - PlaceholderAPI
  - Origins-Reborn

commands:
  tempfly:
    description: Fly for as long as you have time
    aliases: [tf, tfly, soar]
    usage: /<command> [toggle|balance|pay <player> <time>|speed [level]]

permissions:
  tempfly.use:
    description: Toggle TempFly and read your balance
    default: true
  tempfly.pay:
    description: Send TempFly time to other players
    default: true
  tempfly.infinite:
    description: Fly without using up time
    default: false
  tempfly.admin:
    description: Give, take, set and reset time, see the balance of others, reload
    default: op
  tempfly.speed:
    description: Choose a flight speed level with /tempfly speed
    default: true
  tempfly.speed.*:
    description: Every flight speed level
    default: op
    children:
      tempfly.speed: true
      tempfly.speed.1: true
      tempfly.speed.2: true
      tempfly.speed.3: true
      tempfly.speed.4: true
      tempfly.speed.5: true
      tempfly.speed.6: true
      tempfly.speed.7: true
      tempfly.speed.8: true
      tempfly.speed.9: true
      tempfly.speed.10: true
      tempfly.speed.11: true
      tempfly.speed.12: true
      tempfly.speed.13: true
      tempfly.speed.14: true
      tempfly.speed.15: true
      tempfly.speed.16: true
      tempfly.speed.17: true
      tempfly.speed.18: true
      tempfly.speed.19: true
      tempfly.speed.20: true
  tempfly.speed.1:
    description: Fly at speed level 1
    default: true
  tempfly.speed.2:
    description: Fly at speed level 2 or lower
    default: false
  tempfly.speed.3:
    description: Fly at speed level 3 or lower
    default: false
  tempfly.speed.4:
